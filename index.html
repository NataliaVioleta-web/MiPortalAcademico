<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Horario Semanal</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { text-align: center; color: #2c3e50; }
        .dia { background: #2c3e50; color: white; padding: 10px; border-radius: 6px 6px 0 0; margin-top: 15px; font-weight: bold; }
        .clase { background: white; padding: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .clase:last-child { border-radius: 0 0 6px 6px; }
        .bloque { background: #e2e8f0; padding: 4px 8px; border-radius: 4px; font-size: 0.9em; font-weight: bold; }
        .msg { text-align: center; font-style: italic; color: #7f8c8d; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📅 Mi Horario (Jueves y Viernes)</h1>
        <div id="horario"></div>
    </div>

    <script>
        // =========================================================================
        // TU HORARIO EDITABLE (Cambia los textos que están dentro de las comillas)
        // =========================================================================
        const MIS_CLASES = [
            { fecha: "2026-09-03", dia: "Jueves", bloque: "08:30 - 09:40", ramo: "Matemáticas", sala: "Sala 402", tema: "Introducción a Derivadas" },
            { fecha: "2026-09-03", dia: "Jueves", bloque: "09:50 - 11:00", ramo: "Química", sala: "Sala 204", tema: "Estequiometría de soluciones" },
            { fecha: "2026-09-04", dia: "Viernes", bloque: "08:30 - 09:40", ramo: "Física", sala: "Laboratorio", tema: "Cinemática Vectorial" },
            { fecha: "2026-09-10", dia: "Jueves", bloque: "08:30 - 09:40", ramo: "Historia", sala: "Sala 101", tema: "Guerra Fría" }
        ];
        // =========================================================================

        const contenedor = document.getElementById('horario');
        const grupos = {};

        // Agrupar las asignaturas por fecha
        MIS_CLASES.forEach(c => {
            if (!grupos[c.fecha]) grupos[c.fecha] = [];
            grupos[c.fecha].push(c);
        });

        const hoy = new Date().toISOString().split('T')[0];
        const fechasOrdenadas = Object.keys(grupos).sort();
        let totalClasesFuturas = 0;

        fechasOrdenadas.forEach(f => {
            if (f < hoy) return; // Oculta automáticamente los días que ya pasaron
            totalClasesFuturas++;

            const grupoDia = grupos[f];
            
            // Dibujar cabecera del día
            const divD = document.createElement('div');
            divD.className = 'dia';
            divD.innerText = `${grupoDia[0].dia} ${f.split('-').reverse().join('/')}`;
            contenedor.appendChild(divD);

            // Dibujar bloques de clases
            grupoDia.forEach(c => {
                const divC = document.createElement('div');
                divC.className = 'clase';
                const textoTema = c.tema ? `<br><span style="color:#7f8c8d;font-size:0.85em;">📖 Tema: ${c.tema}</span>` : '';
                
                divC.innerHTML = `
                    <div>
                        <strong>${c.ramo}</strong><br>
                        <small style="color:#4a90e2;">📍 ${c.sala}</small>
                        ${textoTema}
                    </div>
                    <div class="bloque">${c.bloque}</div>
                `;
                contenedor.appendChild(divC);
            });
        });

        if (totalClasesFuturas === 0) {
            contenedor.innerHTML = '<div class="msg">No hay clases registradas para fechas futuras en tu archivo.</div>';
        }
    </script>
</body>
</html>
