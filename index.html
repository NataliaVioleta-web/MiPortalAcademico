<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Horario Automatizado</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { text-align: center; color: #2c3e50; }
        .dia { background: #2c3e50; color: white; padding: 10px; border-radius: 6px 6px 0 0; margin-top: 15px; font-weight: bold; }
        .clase { background: white; padding: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .clase:last-child { border-radius: 0 0 6px 6px; }
        .bloque { background: #e2e8f0; padding: 4px 8px; border-radius: 4px; font-size: 0.9em; font-weight: bold; }
        .msg { text-align: center; font-style: italic; color: #7f8c8d; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📅 Mi Horario (Jueves y Viernes)</h1>
        <div id="horario"><div class="msg">Conectando de forma segura...</div></div>
    </div>

    <script>
        // ======= PEGA AQUÍ TU ENLACE DE SHEETY CORRESPONDIENTE =======
        const URL_SHEETY = 'TU_ENLACE_DE_SHEETY_AQUÍ';
        // ============================================================

        const contenedor = document.getElementById('horario');

        fetch(https://api.sheety.co/153a203611b22547f7be81ba05bd3784/hojaDeCálculoSinTítulo/clases)
            .then(response => response.json())
            .then(data => {
                // Sheety devuelve los datos envueltos en el nombre de tu pestaña en minúsculas
                const listaClases = data.clases || data.clase || Object.values(data)[0];
                
                if (!listaClases || listaClases.length === 0) {
                    contenedor.innerHTML = '<div class="msg">No hay datos en tu Google Sheets.</div>';
                    return;
                }

                contenedor.innerHTML = '';
                const grupos = {};

                listaClases.forEach(c => {
                    // Mapea las columnas ignorando mayúsculas/minúsculas
                    const fecha = c.fecha || c.Fecha;
                    const dia = c.dia || c.Día || c.diaSemana;
                    const bloque = c.bloque || c.Bloque || c.hora;
                    const ramo = c.asignatura || c.ramo || c.Asignatura;
                    const sala = c.sala || c.detalle || '';
                    const tema = c.temario || c.contenido || c.tema || '';

                    if (!fecha) return;

                    if (!grupos[fecha]) grupos[fecha] = [];
                    grupos[fecha].push({ dia, bloque, ramo, sala, tema });
                });

                const hoy = new Date().toISOString().split('T')[0];
                const fechasOrdenadas = Object.keys(grupos).sort();
                let totalClases = 0;

                fechasOrdenadas.forEach(f => {
                    if (f < hoy) return; // Filtro automático de fechas pasadas
                    totalClases++;

                    const grupoDia = grupos[f];
                    const divD = document.createElement('div');
                    divD.className = 'dia';
                    
                    // Formatear fecha visualmente
                    const fechaFormateada = f.includes('-') ? f.split('-').reverse().join('/') : f;
                    divD.innerText = `${grupoDia[0].dia || ''} ${fechaFormateada}`;
                    contenedor.appendChild(divD);

                    grupoDia.forEach(c => {
                        const divC = document.createElement('div');
                        divC.className = 'clase';
                        const textoTema = c.tema ? `<br><span style="color:#7f8c8d;font-size:0.85em;">📖 Tema: ${c.tema}</span>` : '';
                        
                        divC.innerHTML = `
                            <div>
                                <strong>${c.ramo || 'Sin nombre'}</strong><br>
                                <small style="color:#4a90e2;">📍 ${c.sala || 'Sin sala'}</small>
                                ${textoTema}
                            </div>
                            <div class="bloque">${c.bloque || '--:--'}</div>
                        `;
                        contenedor.appendChild(divC);
                    });
                });

                if (totalClases === 0) {
                    contenedor.innerHTML = '<div class="msg">No hay clases vigentes para esta semana.</div>';
                }
            })
            .catch(() => {
                contenedor.innerHTML = '<div class="msg" style="color:red;">Error al sincronizar con Sheety. Revisa tu enlace.</div>';
            });
    </script>
</body>
</html>
