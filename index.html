<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Horario y Pruebas</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e74c3c;
            --warning: #f1c40f;
            --bg: #f4f6f7;
            --card-bg: #ffffff;
            --text: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 40px;
        }

        header {
            background-color: var(--primary);
            color: white;
            text-align: center;
            padding: 25px 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }

        h1 { font-size: 1.6rem; margin-bottom: 6px; }
        h2 { font-size: 1rem; opacity: 0.9; font-weight: 400; }

        .contenedor-principal {
            max-width: 650px;
            margin: 0 auto;
            padding: 0 15px;
        }

        .seccion-bloque {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            margin-bottom: 25px;
        }

        .titulo-recuadro {
            font-size: 1.25rem;
            color: var(--primary);
            margin-bottom: 15px;
            padding-left: 12px;
            border-left: 4px solid var(--primary);
            display: flex;
            align-items: center;
        }

        .dia {
            font-weight: bold;
            margin: 15px 0 8px 0;
            font-size: 1rem;
            border-bottom: 1px solid #eaeded;
            padding-bottom: 4px;
        }

        .clase {
            background: #fafbfc;
            border-radius: 8px;
            margin-bottom: 8px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #e5e8e8;
        }

        .info-secundaria {
            font-size: 0.85rem;
            color: #7f8c8d;
            margin-top: 4px;
        }

        .bloque {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: bold;
            white-space: nowrap;
        }

        .msg {
            text-align: center;
            padding: 15px;
            color: #7f8c8d;
            font-style: italic;
        }
    </style>
</head>
<body>

    <header>
        <h1>📚 Mi Portal Académico</h1>
        <h2 id="rango-semana">Calculando semana...</h2>
    </header>

    <div class="contenedor-principal">
        
        <div class="seccion-bloque">
            <h3 class="titulo-recuadro" style="border-left-color: var(--primary);">📅 Mi Horario Semanal</h3>
            <div id="contenedor-horario">
                <div class="msg">Cargando horario... 🔄</div>
            </div>
        </div>

        <div class="seccion-bloque">
            <h3 class="titulo-recuadro" style="border-left-color: var(--accent);">📝 Próximas Pruebas (3 Semanas)</h3>
            <div id="contenedor-pruebas">
                <div class="msg">Cargando pruebas... 🔄</div>
            </div>
        </div>

        <div class="seccion-bloque">
            <h3 class="titulo-recuadro" style="border-left-color: var(--warning);">🦷 Turnos de Toma Radiográfica (3 Semanas)</h3>
            <div id="contenedor-turnos">
                <div class="msg">Cargando turnos... 🔄</div>
            </div>
        </div>

    </div>
    <script>
        const URL_SCRIPT = 'https://script.google.com/macros/s/AKfycbzKDrjUcyywiO1WoXtSyhRFevr6lvCkQ1suX374i7kDbs0uu90eCY0efqBPWe_gx932rQ/exec';

        let fechaLunes, fechaDomingo, fechaLimiteTresSemanas;

        function calcularFechasSemana() {
            const subtituloSemana = document.getElementById('rango-semana');
            const hoy = new Date();
            const diaSemana = hoy.getDay(); 
            const diferenciaLunes = (diaSemana === 0) ? -6 : 1 - diaSemana;
            
            fechaLunes = new Date(hoy);
            fechaLunes.setDate(hoy.getDate() + diferenciaLunes);
            fechaLunes.setHours(0,0,0,0);

            fechaDomingo = new Date(fechaLunes);
            fechaDomingo.setDate(fechaLunes.getDate() + 6);
            fechaDomingo.setHours(23,59,59,999);

            fechaLimiteTresSemanas = new Date(fechaLunes);
            fechaLimiteTresSemanas.setDate(fechaLunes.getDate() + 20); 
            fechaLimiteTresSemanas.setHours(23,59,59,999);

            subtituloSemana.innerText = `Semana del ${fechaLunes.getDate()}/${fechaLunes.getMonth()+1} al ${fechaDomingo.getDate()}/${fechaDomingo.getMonth()+1}`;
        }

        // Procesador inteligente a prueba de fallos
        function interpretarFecha(textoFecha) {
            if (!textoFecha) return null;
            let stringFecha = String(textoFecha).trim();
            
            if (stringFecha.includes('T')) {
                stringFecha = stringFecha.split('T')[0];
            }
            
            let partes = [];
            if (stringFecha.includes('-')) partes = stringFecha.split('-');
            else if (stringFecha.includes('/')) partes = stringFecha.split('/');
            
            if (partes.length !== 3) return null;

            let anio = parseInt(partes[0], 10);
            let mes = parseInt(partes[1], 10) - 1;
            let dia = parseInt(partes[2], 10);

            // Si el formato viene al revés (dd/mm/yyyy) reacomoda los valores de forma automática
            if (anio < 1000) {
                dia = parseInt(partes[0], 10);
                mes = parseInt(partes[1], 10) - 1;
                anio = parseInt(partes[2], 10);
            }

            return new Date(anio, mes, dia);
        }

        function filtrarSoloEstaSemana(lista) {
            if (!lista || !Array.isArray(lista)) return [];
            let ultimoDiaValido = null;

            return lista.filter(item => {
                let fechaTexto = (item.fecha || '').trim();
                if (fechaTexto !== '') ultimoDiaValido = fechaTexto;
                
                let fechaEvaluar = interpretarFecha(fechaTexto !== '' ? fechaTexto : ultimoDiaValido);
                if (!fechaEvaluar) return false;

                return fechaEvaluar >= fechaLunes && fechaEvaluar <= fechaDomingo;
            });
        }

        function filtrarTresSemanas(lista) {
            if (!lista || !Array.isArray(lista)) return [];
            let ultimoDiaValido = null;

            return lista.filter(item => {
                let fechaTexto = (item.fecha || '').trim();
                if (fechaTexto !== '') ultimoDiaValido = fechaTexto;
                
                let fechaEvaluar = interpretarFecha(fechaTexto !== '' ? fechaTexto : ultimoDiaValido);
                if (!fechaEvaluar) return false;

                const evalFecha = new Date(fechaEvaluar).setHours(0,0,0,0);
                const inicioLunes = new Date(fechaLunes).setHours(0,0,0,0);
                const finSubsiguiente = new Date(fechaLimiteTresSemanas).setHours(23,59,59,999);

                return evalFecha >= inicioLunes && evalFecha <= finSubsiguiente;
            });
        }

        function generarBloquesHtml(lista, colorBorde = '#2c3e50', usarTresSemanas = false) {
            const listaFiltrada = usarTresSemanas ? filtrarTresSemanas(lista) : filtrarSoloEstaSemana(lista);
            if (listaFiltrada.length === 0) return '<div class="msg">No hay registros programados.</div>';
            
            let html = '';
            let ultimoDiaRegistrado = '';

            listaFiltrada.forEach(item => {
                let fechaOriginal = item.fecha || '';
                let hora = item.hora || '--:--';
                let lugar = item.lugar || '';
                let ramo = item.ramo || 'Actividad';
                
                // Mapeo automático multinombre para Actividad y Docente
                let actividad = item.actividad || item.detalle || item.actividades || '';
                let encargado = item.encargado || item.docente || item.profesor || '';

                if (fechaOriginal.trim() !== '') ultimoDiaRegistrado = fechaOriginal;
                let diaMostrar = ultimoDiaRegistrado || 'Sin Fecha';

                if (fechaOriginal.trim() !== '' && html.indexOf(`style="color: ${colorBorde};">📅 ${diaMostrar}</div>`) === -1) {
                    html += `<div class="dia" style="color: ${colorBorde};">📅 ${diaMostrar}</div>`;
                }

                html += `
                    <div class="clase" style="border-left: 4px solid ${colorBorde};">
                        <div style="flex: 1; padding-right: 15px;">
                            <strong style="color: #2c3e50; font-size: 1.05em;">${ramo}</strong>
                            <div style="margin: 3px 0; font-weight: 500; color: #555; font-size:0.95em;">${actividad}</div>
                            <div class="info-secundaria">
                                📍 <strong>Lugar:</strong> ${lugar} ${encargado ? `| 👤 <strong>Docente:</strong> ${encargado}` : ''}
                            </div>
                        </div>
                        <div class="bloque" style="background: ${colorBorde}; color: white;">${hora}</div>
                    </div>
                `;
            });

            return html;
        }

        function generarTurnosHtml(lista) {
            const listaFiltrada = filtrarTresSemanas(lista);
            if (listaFiltrada.length === 0) return '<div class="msg">No tienes turnos asignados para estas 3 semanas.</div>';
            
            let html = '';
            listaFiltrada.forEach(item => {
                let fecha = item.fecha || 'Sin fecha';
                let hora = item.hora || 'Todo el día';
                let grupo = item.grupo || item.equipo || '';
                let clinica = item.clinica || item.lugar || 'Clínica Radiológica';
                let detalles = item.detalles || item.observaciones || '';

                html += `
                    <div class="clase" style="border-left: 4px solid var(--warning);">
                        <div style="flex: 1;">
                            <span style="font-size: 0.8rem; font-weight: bold; color: #d35400; background: #fef9e7; padding: 2px 8px; border-radius: 4px;">📅 ${fecha} (${hora})</span>
                            <div style="margin: 5px 0 2px 0; font-weight: 600; color: #2c3e50;">${clinica}</div>
                            <div class="info-secundaria">
                                👥 <strong>Asignación:</strong> ${grupo} ${detalles ? `| 📝 ${detalles}` : ''}
                            </div>
                        </div>
                    </div>
                `;
            });
            return html;
        }

        async function cargarDatosDesdeSheets() {
            const contenedorHorario = document.getElementById('contenedor-horario');
            const contenedorPruebas = document.getElementById('contenedor-pruebas');
            const contenedorTurnos = document.getElementById('contenedor-turnos');

            try {
                const respuesta = await fetch(URL_SCRIPT);
                if (!respuesta.ok) throw new Error("Error de red");
                
                const datos = await respuesta.json();

                contenedorHorario.innerHTML = generarBloquesHtml(datos.clases, '#2c3e50', false);
                contenedorPruebas.innerHTML = generarBloquesHtml(datos.pruebas, '#e74c3c', true);
                contenedorTurnos.innerHTML = generarTurnosHtml(datos.turnos);

            } catch (error) {
                console.error("Error:", error);
                const msgError = '<div class="msg" style="color: red;">⚠️ Error al sincronizar.</div>';
                contenedorHorario.innerHTML = msgError;
                contenedorPruebas.innerHTML = msgError;
                contenedorTurnos.innerHTML = msgError;
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            calcularFechasSemana();
            cargarDatosDesdeSheets();
        });
    </script>
</body>
</html>

</body>
</html>
