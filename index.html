<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Horario Semanal</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { text-align: center; color: #2c3e50; }
        .dia { background: #2c3e50; color: white; padding: 10px; border-radius: 6px 6px 0 0; margin-top: 15px; font-weight: bold; }
        .clase { background: white; padding: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .clase:last-child { border-radius: 0 0 6px 6px; }
        .bloque { background: #e2e8f0; padding: 4px 8px; border-radius: 4px; font-size: 0.9em; font-weight: bold; }
        .msg { text-align: center; font-style: italic; color: #7f8c8d; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📅 Mi Horario (Jueves y Viernes)</h1>
        <div id="horario"><div class="msg">Cargando clases desde la planilla...</div></div>
    </div>
    <script>
        // Enlace base original de Google
        const GOOGLE_URL = 'https://google.com';
        
        // Pasamos el enlace por un servidor Proxy libre de bloqueos
        const PROXY_URL = 'https://corsproxy.io/?' + encodeURIComponent(GOOGLE_URL);

        fetch(PROXY_URL)
            .then(r => {
                if (!r.ok) throw new Error();
                return r.text();
            })
            .then(txt => {
                // Procesador automático de filas CSV
                const filas = txt.split('\n').map(f => f.split(',').map(c => c.replace(/^"|"$/g, '').trim()));
                const contenedor = document.getElementById('horario'); 
                contenedor.innerHTML = '';
                const grupos = {};
                
                filas.slice(1).forEach(col => {
                    if (col.length < 4 || !col || col[0] === "") return;
                    const f = col[0]; // Fecha
                    if (!grupos[f]) grupos[f] = [];
                    grupos[f].push({ dia: col[1], bloque: col[2], ramo: col[3], sala: col[4] || '', tema: col[5] || '' });
                });

                const hoy = new Date().toISOString().split('T')[0];
                const fechas = Object.keys(grupos).sort();
                let total = 0;

                fechas.forEach(f => {
                    if (f < hoy) return; // Oculta automáticamente los días pasados
                    total++;
                    
                    const divD = document.createElement('div'); 
                    divD.className = 'dia';
                    divD.innerText = `${grupos[f][0].dia} ${f.split('-').reverse().join('/')}`;
                    contenedor.appendChild(divD);

                    grupos[f].forEach(c => {
                        const divC = document.createElement('div'); 
                        divC.className = 'clase';
                        const t = c.tema ? `<br><span style="color:#7f8c8d;font-size:0.85em;">📖 Tema: ${c.tema}</span>` : '';
                        divC.innerHTML = `<div><strong>${c.ramo}</strong><br><small style="color:#4a90e2;">📍 ${c.sala}</small>${t}</div><div class="bloque">${c.bloque}</div>`;
                        contenedor.appendChild(divC);
                    });
                });

                if (total === 0) {
                    contenedor.innerHTML = '<div class="msg">No hay clases programadas para esta semana o fechas futuras. Revisa las fechas en tu Google Sheets.</div>';
                }
            })
            .catch(() => { 
                document.getElementById('horario').innerHTML = '<div class="msg" style="color:red;">Error al conectar con la planilla pública.</div>'; 
            });
    </script>
</body>
</html>
