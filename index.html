<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Horario Académico</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 5px; }
        .subtitulo { text-align: center; color: #7f8c8d; font-style: italic; margin-bottom: 25px; font-size: 0.95em; }
        .dia { background: #2c3e50; color: white; padding: 10px; border-radius: 6px 6px 0 0; margin-top: 25px; font-weight: bold; }
        .clase { background: white; padding: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .clase:last-child { border-radius: 0 0 6px 6px; margin-bottom: 10px; }
        .bloque { background: #e2e8f0; padding: 4px 8px; border-radius: 4px; font-size: 0.9em; font-weight: bold; white-space: nowrap; }
        .info-secundaria { color: #7f8c8d; font-size: 0.85em; margin-top: 4px; line-height: 1.4; }
        .msg { text-align: center; font-style: italic; color: #7f8c8d; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📅 Mi Horario Semanal</h1>
        <div class="subtitulo" id="rango-semana">Calculando semana...</div>
        <div id="horario"><div class="msg">Sincronizando con Google Sheets...</div></div>
    </div>

    <script>
        // ======= PEGA TU URL DE GOOGLE APPS SCRIPT AQUÍ ABAJO =======
        const URL_SCRIPT = 'https://script.google.com/macros/s/AKfycbzKDrjUcyywiO1WoXtSyhRFevr6lvCkQ1suX374i7kDbs0uu90eCY0efqBPWe_gx932rQ/exec';
        // ============================================================

        const contenedor = document.getElementById('horario');
        const subtituloSemana = document.getElementById('rango-semana');

        // --- CÁLCULO DE LA SEMANA ACTUAL DE LUNES A DOMINGO ---
        const hoy = new Date();
        const diaSemana = hoy.getDay(); 
        const diferenciaLunes = diaSemana === 0 ? -6 : 1 - diaSemana;
        
        const lunesActual = new Date(hoy);
        lunesActual.setDate(hoy.getDate() + diferenciaLunes);
        lunesActual.setHours(0,0,0,0);

        const domingoActual = new Date(lunesActual);
        domingoActual.setDate(lunesActual.getDate() + 6);
        domingoActual.setHours(23,59,59,999);

        // Formatear rango visual para el subtítulo (DD/MM)
        const formatoCorto = (d) => `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}`;
        subtituloSemana.innerText = `Semana del ${formatoCorto(lunesActual)} al ${formatoCorto(domingoActual)}`;

        fetch(URL_SCRIPT)
            .then(response => response.json())
            .then(data => {
                const listaClases = data.clases;
                if (!listaClases || listaClases.length === 0) {
                    contenedor.innerHTML = '<div class="msg">No se encontraron actividades registradas en tu Google Sheets.</div>';
                    return;
                }

                contenedor.innerHTML = '';
                const grupos = {};
                let totalClasesSemana = 0;

                listaClases.forEach(c => {
                    const fechaTexto = c.fecha;
                    if (!fechaTexto) return;

                    // Convertir el texto AAAA-MM-DD en un objeto de fecha real para comparar
                    const [ano, mes, dia] = fechaTexto.split('-');
                    const fechaClase = new Date(ano, mes - 1, dia, 12, 0, 0);

                    // FILTRO INTELIGENTE: Solo guardar si pertenece a la semana actual
                    if (fechaClase >= lunesActual && fechaClase <= domingoActual) {
                        if (!grupos[fechaTexto]) grupos[fechaTexto] = [];
                        grupos[fechaTexto].push(c);
                        totalClasesSemana++;
                    }
                });

                const fechasOrdenadas = Object.keys(grupos).sort();

                fechasOrdenadas.forEach(f => {
                    const grupoDia = grupos[f];
                    const divD = document.createElement('div');
                    divD.className = 'dia';
                    
                    const fechaFormateada = f.split('-').reverse().join('/');
                    divD.innerText = `Bloque Académico: ${fechaFormateada}`;
                    contenedor.appendChild(divD);

                    grupoDia.forEach(c => {
                        const divC = document.createElement('div');
                        divC.className = 'clase';
                        
                        const textoActividad = c.actividad ? `<br>📖 <strong>Actividad:</strong> ${c.actividad}` : '';
                        const textoEncargado = c.encargado ? `<br>👤 <strong>Encargado:</strong> ${c.encargado}` : '';
                        
                        divC.innerHTML = `
                            <div>
                                <strong style="font-size: 1.1em; color: #1a202c;">${c.ramo}</strong><br>
                                <small style="color:#4a90e2; font-weight: 500;">📍 ${c.lugar}</small>
                                <div class="info-secundaria">${textoActividad}${textoEncargado}</div>
                            </div>
                            <div class="bloque">${c.hora || 'AM/PM'}</div>
                        `;
                        contenedor.appendChild(divC);
                    });
                });

                if (totalClasesSemana === 0) {
                    contenedor.innerHTML = '<div class="msg">No tienes actividades programadas para esta semana actual en tu planilla.</div>';
                }
            })
            .catch(err => {
                contenedor.innerHTML = '<div class="msg" style="color:red;">Error al procesar los datos de tu horario.</div>';
                console.error(err);
            });
    </script>
</body>
</html>

</html>
